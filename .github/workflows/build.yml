name: build

# Build otomatis Snake Go di Linux, Windows, dan macOS.
# Otomatis membuat GitHub Release saat tag v* di-push (misal: git tag v1.0.0 && git push origin v1.0.0)
# atau saat tombol "Run workflow" dijalankan dengan opsi rilis dicentang.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publikasikan ke GitHub Releases?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Siapkan metadata versi
        shell: bash
        run: |
          VERSION="1.0.1"
          [ -f VERSION ] && VERSION=$(cat VERSION | tr -d '[:space:]')
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "none")
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "LDFLAGS=-X banguncandi/pkg/version.Version=${VERSION} -X banguncandi/pkg/version.GitCommit=${GIT_COMMIT} -X banguncandi/pkg/version.BuildDate=${BUILD_DATE}" >> $GITHUB_ENV

      - name: Dependensi GUI (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev
          libxcursor-dev libxinerama-dev libgl1-mesa-dev

      - name: Dependensi GUI (Windows, via MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Tambahkan compiler MSYS2 ke PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\\msys64\\mingw64\\bin" >> $GITHUB_PATH

      - name: Build terminal
        shell: bash
        run: go build -ldflags="$LDFLAGS" -o snake-go-terminal .

      - name: Build GUI desktop (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: 1
          CC: gcc
        run: |
          cd gui
          windres -i snake-go.rc -O coff -o icon_windows_amd64.syso || true
          go build -ldflags="-H windowsgui $LDFLAGS" -o ../snake-go-gui.exe .

      - name: Build GUI desktop (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd gui
          go build -ldflags="$LDFLAGS" -o ../snake-go-gui .

      - name: Package macOS App Bundle & DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp snake-go-gui dist/
          bash installers/macos/package_macos.sh
          cp -R dist/Snake-Go.app . 2>/dev/null || true
          cp dist/*.dmg . 2>/dev/null || true

      - name: Test logika scores & terminal
        run: go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: snake-go-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            snake-go-*
            *.dmg
            Snake-Go.app

  # Job otomatis mempublikasikan binary ke GitHub Releases
  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unduh seluruh build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Siapkan aset rilis per platform
        run: |
          mkdir -p dist-release
          VERSION="1.0.1"
          [ -f VERSION ] && VERSION=$(cat VERSION | tr -d '[:space:]')

          # 1. Linux
          if [ -d "artifacts/snake-go-Linux" ]; then
            cp artifacts/snake-go-Linux/snake-go-gui dist-release/snake-go-gui-linux-amd64 2>/dev/null || true
            cp artifacts/snake-go-Linux/snake-go-terminal dist-release/snake-go-terminal-linux-amd64 2>/dev/null || true
            chmod +x dist-release/* 2>/dev/null || true
          fi

          # 2. Windows
          if [ -d "artifacts/snake-go-Windows" ]; then
            cp artifacts/snake-go-Windows/snake-go-gui.exe dist-release/snake-go-gui-windows-amd64.exe 2>/dev/null || true
            cp artifacts/snake-go-Windows/snake-go-terminal.exe dist-release/snake-go-terminal-windows-amd64.exe 2>/dev/null || true
          fi

          # 3. macOS
          if [ -d "artifacts/snake-go-macOS" ]; then
            cp artifacts/snake-go-macOS/*.dmg dist-release/ 2>/dev/null || true
            cp artifacts/snake-go-macOS/snake-go-terminal dist-release/snake-go-terminal-darwin 2>/dev/null || true
            chmod +x dist-release/snake-go-terminal-darwin 2>/dev/null || true
          fi

          # 4. Paket zip installer lengkap
          zip -r dist-release/snake-go-installers-v${VERSION}.zip installers/ gui/icon.ico snake-go.desktop README.md VERSION

          echo "Aset rilis yang siap dipublikasikan ke GitHub Releases:"
          ls -lh dist-release/

      - name: Tentukan Tag Rilis
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
            echo "TAG_NAME=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Publikasikan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: Snake Go ${{ steps.tag_info.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist-release/*
