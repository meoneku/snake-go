name: build

# Build otomatis Ular-ularan di Linux, Windows, dan macOS.
# Cara pakai: push repo ini ke GitHub → tab Actions → download artifact per OS.
# Pemicu manual juga bisa via tombol "Run workflow".
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Dependensi GUI (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev
          libxcursor-dev libxinerama-dev libgl1-mesa-dev

      - name: Dependensi GUI (Windows, via MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Tambahkan compiler MSYS2 ke PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\\msys64\\mingw64\\bin" >> $GITHUB_PATH

      - name: Build terminal
        run: go build -o ular-terminal .

      - name: Build GUI desktop (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd gui
          go build -ldflags="-H windowsgui" -o ../ular-gui .

      - name: Build GUI desktop (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd gui
          go build -o ../ular-gui .

      - name: Test logika terminal
        run: go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: ular-ularan-${{ runner.os }}
          path: ular-*
